[package]
name = "daydream-desktop"
version = "0.1.0"
description = "Local-first desktop recall assistant"
authors = ["Felix Faust <daydream@turtledev.net>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/snackbit/daydream"
homepage = "https://github.com/snackbit/daydream"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daydream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
bindgen = "0.72.1"
cmake = "0.1.54"
tauri-build = { version = "2.7.1", features = [] }

[features]
default = []
whisper-cuda = []
whisper-vulkan = []
embedding-vulkan = []

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.27.0", features = ["rng", "v7", "v4"] }
base64 = "0.22.1"
aes-gcm = "0.10.3"
png = "0.18.1"
jpeg-encoder = "=0.7.1"
futures-util = "0.3.31"
eventsource-stream = "=0.2.3"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
async-openai = { version = "=0.42.1", default-features = false, features = ["rustls", "responses", "chat-completion", "embedding", "byot", "middleware"] }
model-http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
secrecy = "0.10"
regex = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "macros", "net"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
gio = "=0.18.4"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
enumflags2 = "0.7.12"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8.9"
pipewire = "0.9.2"
pulse = { package = "libpulse-binding", version = "2.30.1" }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
gstreamer-video = "0.24"
evdev = "0.13.2"
x11-dl = "2.21.0"
wayland-client = "0.31.14"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "5.19.0"
