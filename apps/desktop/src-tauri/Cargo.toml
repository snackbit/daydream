[package]
name = "daydream-desktop"
version = "0.1.0"
description = "Local-first desktop recall assistant"
authors = ["Snackbit"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daydream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.2", features = ["rng", "v7"] }
base64 = "0.22.1"
png = "0.18.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.11", default-features = false, features = ["tokio", "screencast"] }
enumflags2 = "0.7.12"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8.9"
pipewire = "0.9.2"
pulse = { package = "libpulse-binding", version = "2.30.1" }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
